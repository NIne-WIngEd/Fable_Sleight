<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="352" viewBox="0 0 1200 352" role="img" aria-labelledby="title desc">
  <title id="title">Use, personalize, build: the path to a personal model</title>
  <desc id="desc">A comparison of hosted AI, personalized open weights, and the Fable Builder. Fable's goal is to build personal model weights for you from your chosen data; frontier feature models come later.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10152b"/>
      <stop offset="1" stop-color="#0e2934"/>
    </linearGradient>
    <linearGradient id="fable" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9ac8ff"/>
      <stop offset="1" stop-color="#92eed5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="352" rx="22" fill="url(#bg)"/>
  <text x="44" y="48" fill="#a9b9d4" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="3">THE OWNERSHIP QUESTION</text>
  <text x="44" y="89" fill="#f7f9ff" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700">Where does the model come from?</text>

  <g font-family="Arial,Helvetica,sans-serif">
    <rect x="43" y="114" width="344" height="191" rx="16" fill="#ffffff" fill-opacity=".045" stroke="#a0aacc" stroke-opacity=".42"/>
    <text x="65" y="145" fill="#b4bdd2" font-size="13" font-weight="700" letter-spacing="2">01 / USE</text>
    <text x="65" y="184" fill="#f5f7fc" font-size="26" font-weight="700">Hosted AI</text>
    <path d="M65 202H365" stroke="#ffffff" stroke-opacity=".14"/>
    <text x="65" y="232" fill="#d5dfed" font-size="17">The provider builds the model.</text>
    <text x="65" y="260" fill="#aebbd0" font-size="16">You use its weights.</text>

    <path d="M396 208H421M412 199L421 208L412 217" fill="none" stroke="#a9c9dc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="429" y="114" width="344" height="191" rx="16" fill="#ffffff" fill-opacity=".055" stroke="#91b7e4" stroke-opacity=".55"/>
    <text x="451" y="145" fill="#aed0fb" font-size="13" font-weight="700" letter-spacing="2">02 / PERSONALIZE</text>
    <text x="451" y="184" fill="#f5f7fc" font-size="26" font-weight="700">Local open weights</text>
    <path d="M451 202H751" stroke="#ffffff" stroke-opacity=".14"/>
    <text x="451" y="232" fill="#d5dfed" font-size="17">Someone else built the base.</text>
    <text x="451" y="260" fill="#aebbd0" font-size="16">You adapt it to yourself.</text>

    <path d="M782 208H807M798 199L807 208L798 217" fill="none" stroke="#a9c9dc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="815" y="114" width="344" height="191" rx="16" fill="#a6ebdc" fill-opacity=".105" stroke="#9be6d3" stroke-opacity=".83"/>
    <text x="837" y="145" fill="#9be6d3" font-size="13" font-weight="700" letter-spacing="2">03 / BUILD YOURS</text>
    <text x="837" y="184" fill="url(#fable)" font-size="26" font-weight="700">Fable Builder</text>
    <path d="M837 202H1137" stroke="#9be6d3" stroke-opacity=".3"/>
    <text x="837" y="232" fill="#effbf8" font-size="17">It builds your personal weights.</text>
    <text x="837" y="260" fill="#cee8e3" font-size="16">Your foundation grows with you.</text>
  </g>
  <text x="45" y="332" fill="#a8b8ca" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="1.5">FABLE'S PRODUCT GOAL · FRONTIER FEATURE MODELS COME LATER</text>
</svg>